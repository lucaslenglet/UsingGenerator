name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      # The only check that proves the analyzer reaches a consumer through a package
      # reference. It packs to a local feed, so it needs no credentials.
      - name: Packaging
        shell: pwsh
        run: ./tests/Packaging/run.ps1
